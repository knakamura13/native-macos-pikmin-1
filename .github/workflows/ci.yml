# Build Pikmin 1 (game, launcher, tools and tests) and Pikmin 2 (game and
# tests) on macOS, Linux and Windows, then run both ctest suites. Nothing here
# needs a game disc or extracted game data: tests that do are excluded below.
name: CI

on:
  pull_request:
  push:
    branches: [main, kyle-develop]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: "true"
  # pc_jaudio_integration_test runs the game with --audio-self-test and needs
  # the disc's sound banks (LABELS "game-assets"). CI never has a disc.
  CTEST_EXCLUDE_LABELS: game-assets
  # Static skip list for scenario runs (see the gl-probe job): runner.os values
  # whose GL probe failed, each with a linked tracking issue. Empty today.
  SCENARIO_SKIP_OS: ""

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-26
            shell: bash
          - name: Linux (x86-64)
            os: ubuntu-latest
            shell: bash
          - name: Windows (x86-64, MinGW-w64)
            os: windows-latest
            shell: msys2 {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 ninja ccache

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache pkg-config libsdl2-dev libgl1-mesa-dev libx11-dev \
            libgl1-mesa-dri libglx-mesa0 libegl-mesa0 xvfb

      # The release .exe files are built with MinGW-w64 GCC (cross-compiled
      # from Linux), so Windows uses the same compiler natively through MSYS2
      # and can run the tests. setup-msys2 caches the packages between runs.
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-mesa

      # MinGW predefines WIN32, which selects the original game's Win32/OpenGL
      # code paths. cmake/toolchain-mingw64.cmake removes it for the release
      # cross build; this does the same for the native MSYS2 build.
      - name: Platform flags
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo 'PLATFORM_FLAGS=-DCMAKE_C_FLAGS=-UWIN32 -DCMAKE_CXX_FLAGS=-UWIN32' >> "$GITHUB_ENV"
          fi

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      # One build for the unit tests and the scenarios (#59): native JAudio off (the
      # legacy audio facade needs no sound data) and the scenario option on. The
      # scenario tests run on stand-in assets that a generator writes into the build
      # directory (no game data), so they carry no game-assets label. Native
      # JAudio is compiled by the separate jaudio-build job.
      - name: Configure Pikmin 1
        run: |
          cmake -S games/pikmin1 -B build/pikmin1 -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPIKMIN_BUILD_LAUNCHER=ON -DPIKMIN_BUILD_TESTS=ON \
            -DPIKMIN_NATIVE_JAUDIO=OFF -DPIKMIN_BUILD_SCENARIOS=ON \
            $PLATFORM_FLAGS

      # -k 0: report every compile error in one run, not only the first.
      - name: Build Pikmin 1
        id: build-p1
        run: cmake --build build/pikmin1 --parallel -- -k 0

      # Scenarios need a GL context (hidden window). A runner that cannot create
      # one is on SCENARIO_SKIP_OS with a tracking issue; the scenario binary exits
      # 4 on a context failure, so it is never read as a failed scenario. Each test
      # has its own scratch save directory and log names, so they run in parallel.
      - name: Test Pikmin 1 scenarios
        if: ${{ !cancelled() && steps.build-p1.outcome == 'success' && !contains(env.SCENARIO_SKIP_OS, runner.os) }}
        env:
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          # One llvmpipe thread per process: with 4 scenarios in parallel on a
          # 4-core runner, the default (one rasteriser thread per core each) only
          # adds contention. macOS uses Apple's renderer and keeps -j 3.
          LP_NUM_THREADS: "1"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Without Mesa beside the exe, Windows returns GDI Generic GL 1.1.
            cp /mingw64/bin/opengl32.dll /mingw64/bin/libgallium_wgl.dll build/pikmin1/bin/
          fi
          JOBS=4
          if [ "$RUNNER_OS" = "macOS" ]; then JOBS=3; fi
          RUN="ctest --test-dir build/pikmin1 --output-on-failure --timeout 600 -j $JOBS -R ^scenario_ -LE game-assets"
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a $RUN; else $RUN; fi

      # The throw_release calibration K per rate (a tuned fit; printed, not asserted).
      - name: Scenario calibration summary
        if: ${{ !cancelled() && steps.build-p1.outcome == 'success' && !contains(env.SCENARIO_SKIP_OS, runner.os) }}
        run: bash games/pikmin1/tools/scenarios/ci_k_summary.sh build/pikmin1 "${{ matrix.name }}, native JAudio off"

      - name: Configure Pikmin 2
        if: ${{ !cancelled() }}
        run: |
          cmake -S games/pikmin2 -B build/pikmin2 -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTING=ON \
            $PLATFORM_FLAGS

      - name: Build Pikmin 2
        id: build-p2
        if: ${{ !cancelled() }}
        run: cmake --build build/pikmin2 --parallel -- -k 0

      - name: Test Pikmin 1
        if: ${{ !cancelled() && steps.build-p1.outcome == 'success' }}
        run: ctest --test-dir build/pikmin1 --output-on-failure --timeout 300 -LE "$CTEST_EXCLUDE_LABELS" -E ^scenario_

      - name: Test Pikmin 2
        if: ${{ !cancelled() && steps.build-p2.outcome == 'success' }}
        run: ctest --test-dir build/pikmin2 --output-on-failure --timeout 300 -LE "$CTEST_EXCLUDE_LABELS"

      - name: ccache stats
        if: ${{ !cancelled() }}
        run: ccache --show-stats

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ runner.os }}
          path: |
            build/*/Testing/Temporary/LastTest*.log
            build/*/scenario-logs/
            build/*/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  # Compile-only check of the native JAudio configuration (the one release
  # builds use), which the main job no longer builds. Linux only: the engine code
  # is platform-neutral and this runs in parallel with the other jobs.
  jaudio-build:
    name: Native JAudio build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_TYPE: Release
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 300M
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache pkg-config libsdl2-dev libgl1-mesa-dev libx11-dev
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-jaudio-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-jaudio-${{ runner.os }}-
      - name: Configure
        run: |
          cmake -S games/pikmin1 -B build/jaudio -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPIKMIN_BUILD_LAUNCHER=OFF -DPIKMIN_BUILD_TESTS=ON \
            -DPIKMIN_NATIVE_JAUDIO=ON
      - name: Build
        run: cmake --build build/jaudio --parallel -- -k 0

  # The stand-in scenarios on a native JAudio build (standin-audio.md): the
  # stand-in pikiseq.arc lets the engine boot a stage with no disc. Linux only,
  # a separate build so jaudio-build keeps checking the release configuration.
  jaudio-scenarios:
    name: Native JAudio scenarios (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_TYPE: Release
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 300M
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache pkg-config libsdl2-dev libgl1-mesa-dev libx11-dev \
            libgl1-mesa-dri libglx-mesa0 libegl-mesa0 xvfb
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-jaudio-scen-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-jaudio-scen-${{ runner.os }}-
      - name: Configure
        run: |
          cmake -S games/pikmin1 -B build/pikmin1 -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPIKMIN_BUILD_LAUNCHER=OFF -DPIKMIN_BUILD_TESTS=ON \
            -DPIKMIN_NATIVE_JAUDIO=ON -DPIKMIN_BUILD_SCENARIOS=ON
      - name: Build
        id: build
        run: cmake --build build/pikmin1 --parallel --target pikmin_pc nectar_standin_generator -- -k 0
      - name: Test scenarios
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: "1"
        run: |
          xvfb-run -a ctest --test-dir build/pikmin1 --output-on-failure --timeout 600 -j 4 \
            -R '^scenario_(boot_smoke|throw_release|day30_clock)_' -E _disc
      - name: Scenario calibration summary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash games/pikmin1/tools/scenarios/ci_k_summary.sh build/pikmin1 "Linux (x86-64), native JAudio on"
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-jaudio-scenarios
          path: |
            build/pikmin1/Testing/Temporary/LastTest*.log
            build/pikmin1/scenario-logs/
          if-no-files-found: ignore


  # Reports, per OS, whether a hidden-window GL context of the kind the game
  # requests can be created (4.1 core on macOS, 3.3 compatibility elsewhere),
  # logs GL_VERSION and GL_RENDERER, and fails on anything below that version.
  # Scenario jobs (#63) run only on an OS whose probe passes. An OS whose probe
  # fails is added to SCENARIO_SKIP_OS below, with a linked tracking issue, in
  # the same change that shows the failure. Its build and unit tests still run.
  gl-probe:
    name: GL probe (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-26
            shell: bash
          - name: Linux (x86-64)
            os: ubuntu-latest
            shell: bash
          - name: Windows (x86-64, MinGW-w64)
            os: windows-latest
            shell: msys2 {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      SDL_AUDIODRIVER: dummy
      # Static skip list: space-separated runner.os values whose probe failed.
      # Format: "<OS> (<tracking issue URL>)". Empty until a probe fails.
      SCENARIO_SKIP_OS: ""

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0 xvfb

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-mesa

      - name: Build probe
        run: |
          cc games/pikmin1/tools/scenarios/gl_probe.c $(sdl2-config --cflags --libs) -o gl_probe

      # Windows without Mesa returns a GDI Generic 1.1 context. The Mesa DLLs
      # go beside the exe, and llvmpipe is selected explicitly.
      - name: Run probe
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./gl_probe
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cp /mingw64/bin/opengl32.dll /mingw64/bin/libgallium_wgl.dll . 2>/dev/null || true
            ls -la opengl32.dll libgallium_wgl.dll || echo "Mesa DLLs not found beside the exe"
            # A context that hangs is a probe failure, not a stuck job.
            GALLIUM_DRIVER=llvmpipe timeout 120 ./gl_probe
          else
            ./gl_probe
          fi
