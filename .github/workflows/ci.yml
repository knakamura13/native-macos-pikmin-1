# Build Pikmin 1 (game, launcher, tools and tests) and Pikmin 2 (game and
# tests) on macOS, Linux and Windows, then run both ctest suites. The two games
# are separate matrix jobs so they run at the same time. Nothing here needs a
# game disc or extracted game data: tests that do are excluded below.
#
# A pull request that changes only one game skips that game's configure, build
# and test steps (.github/scripts/changed-games.sh). The six jobs still start,
# so a required check is not left pending. Pushes and manual runs build both.
# Empty outputs (a failed changes job) build both games.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. Pushes and manual runs each get
# their own group (the run id) and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_TYPE: Release
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: "true"
  # pc_jaudio_integration_test runs the game with --audio-self-test and needs
  # the disc's sound banks (LABELS "game-assets"). CI never has a disc.
  CTEST_EXCLUDE_LABELS: game-assets

jobs:
  # Which games a pull request touches (.github/scripts/changed-games.sh): a pull request that
  # changes only Pikmin 2's own files skips the Pikmin 1 build and tests, one that changes only
  # Pikmin 1's own files skips Pikmin 2's, and anything else (libs/, tests/, versions.json,
  # .github/, top-level files, the dolphin_stubs Pikmin 2 compiles) builds both. Pushes and
  # manual runs build both. The skips are steps inside build-and-test, so its checks always
  # finish (no status check here is required on main or the disc-free base branch, 2026-11-04,
  # but a required one would not be left pending). If this job fails, its outputs are empty
  # and both games build.
  changes:
    name: Changed games
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pikmin1: ${{ steps.classify.outputs.pikmin1 }}
      pikmin2: ${{ steps.classify.outputs.pikmin2 }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          # The pull request files API lists at most 3000 files; a larger one builds both.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "${PR_CHANGED_FILES:-3000}" -lt 3000 ]; then
            # Both sides of a rename count: moving a file out of a game changes that game.
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)' > changed.txt
            echo "$(wc -l < changed.txt) changed path(s)"
          else
            : > changed.txt
          fi
          bash .github/scripts/changed-games.sh < changed.txt | tee -a "$GITHUB_OUTPUT"

  build-and-test:
    name: ${{ matrix.runner_name }}, ${{ matrix.game == 'p1' && 'Pikmin 1' || 'Pikmin 2' }}
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # 'false' only when the changes job says this game is untouched; empty (a failed or
      # skipped changes job) builds it.
      BUILD_THIS: ${{ (matrix.game == 'p1' && needs.changes.outputs.pikmin1 != 'false') || (matrix.game == 'p2' && needs.changes.outputs.pikmin2 != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        game: [p1, p2]
        include:
          - os: macos-latest
            runner_name: macOS (arm64)
            shell: bash
          - os: ubuntu-latest
            runner_name: Linux (x86-64)
            shell: bash
          - os: windows-latest
            runner_name: Windows (x86-64, MinGW-w64)
            shell: msys2 {0}
          - game: p1
            source: games/pikmin1
            build_dir: build/pikmin1
            cmake_options: "-DPIKMIN_BUILD_LAUNCHER=ON -DPIKMIN_BUILD_TESTS=ON -DPIKMIN_NATIVE_JAUDIO=ON"
          - game: p2
            source: games/pikmin2
            build_dir: build/pikmin2
            cmake_options: "-DBUILD_TESTING=ON"
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 ninja ccache

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache pkg-config libsdl2-dev libgl1-mesa-dev libx11-dev

      # The release .exe files are built with MinGW-w64 GCC (cross-compiled
      # from Linux), so Windows uses the same compiler natively through MSYS2
      # and can run the tests. setup-msys2 caches the packages between runs.
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2

      # MinGW predefines WIN32, which selects the original game's Win32/OpenGL
      # code paths. cmake/toolchain-mingw64.cmake removes it for the release
      # cross build; this does the same for the native MSYS2 build.
      - name: Platform flags
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo 'PLATFORM_FLAGS=-DCMAKE_C_FLAGS=-UWIN32 -DCMAKE_CXX_FLAGS=-UWIN32' >> "$GITHUB_ENV"
          fi

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          # Separate keys so the two games, which now run together, do not
          # overwrite each other's cache. The last prefix still matches the
          # combined cache from before the split.
          key: ccache-${{ matrix.game }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.game }}-${{ runner.os }}-${{ runner.arch }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure
        if: ${{ env.BUILD_THIS == 'true' }}
        run: |
          cmake -S "${{ matrix.source }}" -B "${{ matrix.build_dir }}" -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ${{ matrix.cmake_options }} \
            $PLATFORM_FLAGS

      # -k 0: report every compile error in one run, not only the first.
      - name: Build
        if: ${{ env.BUILD_THIS == 'true' }}
        run: cmake --build "${{ matrix.build_dir }}" --parallel -- -k 0

      - name: Test
        if: ${{ env.BUILD_THIS == 'true' }}
        run: ctest --test-dir "${{ matrix.build_dir }}" --output-on-failure --timeout 300 -LE "$CTEST_EXCLUDE_LABELS"

      - name: ccache stats
        if: ${{ !cancelled() }}
        run: ccache --show-stats

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.game }}-${{ runner.os }}
          path: |
            ${{ matrix.build_dir }}/Testing/Temporary/LastTest*.log
            ${{ matrix.build_dir }}/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
