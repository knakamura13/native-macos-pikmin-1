# Mac keyboard layout for Pikmin 1, in the game's settings format.
# build-app.sh --install merges these lines into the device settings file,
# ~/.local/share/pikmin-native/pikmin_settings.conf. Other settings are kept.
# The key numbers are SDL scancodes. Action numbers follow PC_KEY_ACT_* in pc_window.h.
#
# Y (3): Left Option
key_3 = 226
# D-pad (8 to 11): keys 3, 4, 1, 2
key_8 = 32
key_9 = 33
key_10 = 30
key_11 = 31
# Main stick (12 to 15): arrow keys
key_12 = 82
key_13 = 81
key_14 = 80
key_15 = 79
# Main stick, second key (12 to 15): WASD
key2_12 = 26
key2_13 = 22
key2_14 = 4
key2_15 = 7
# Mouse Cursor control mode (1 = PC_CONTROL_MOUSE_CURSOR)
controlMode = 1
